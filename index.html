<style>
:root{
  --bg1:#0b1b2b; --text:#e8f4ff; --muted:#8fb3c9; --grid:rgba(160,220,255,.22);
  --miss:#cfe9ff; --hit:#ff7a2e; --accent:#3ee0c0; --panel:rgba(8,20,34,.78);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px);
  background:radial-gradient(120% 80% at 50% 0%,#17405e 0%,var(--bg1) 70%);overflow:hidden}
.sea{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px);
  animation:drift 14s linear infinite}
@keyframes drift{to{background-position:400px 0}}
header{position:relative;display:flex;justify-content:space-between;align-items:center;padding:6px 6px 0}
.title{font-weight:800;letter-spacing:.5px}
.zone{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lab{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.bw{display:grid;grid-template-columns:14px 1fr;grid-template-rows:14px auto;width:min(94vw,38vh);max-width:420px}
.ltr{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(10,1fr);font-size:10px;color:var(--muted);text-align:center}
.num{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(10,1fr);font-size:10px;color:var(--muted);text-align:center;align-items:center}
.grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:3px;border-radius:8px;
  background:rgba(0,0,0,.2);box-shadow:0 0 0 1px var(--grid),0 10px 30px rgba(0,0,0,.4)}
.c{position:relative;aspect-ratio:1;border-radius:3px;background:rgba(120,190,230,.08);box-shadow:inset 0 0 0 1px var(--grid);transition:background .25s}
.c.can{cursor:pointer}
.c.can:active{background:rgba(62,224,192,.3)}
.c.ship{background:linear-gradient(160deg,#d3dde7,#7b8a99);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.4)}
.c.ship.dead{background:linear-gradient(160deg,#6b5a5a,#3a2e33)}
.c.rev:not(.hit):not(.sunk){background:rgba(200,215,230,.28)}
.c.hit{background:radial-gradient(circle,#ffb27a 0%,#ff6a1f 45%,#7a2409 100%)}
.c.hit::after{content:"";position:absolute;inset:26%;border-radius:50%;background:rgba(255,255,255,.55)}
.c.miss::after{content:"";position:absolute;left:50%;top:50%;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:50%;background:var(--miss)}
.c.sunk{background:radial-gradient(circle,#6d1e1e,#2a0b0b)}
.c.aim{box-shadow:inset 0 0 0 2px #ff5a5a,0 0 10px rgba(255,90,90,.6)}
.c.aim::after{content:"";position:absolute;inset:18%;border:2px solid #ff5a5a;border-radius:50%;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#zb.shake .bw{animation:shake .45s linear}
.menu{width:min(94vw,400px);text-align:center}
.logo{font-size:46px;animation:bobL 3s ease-in-out infinite}
@keyframes bobL{50%{transform:translateY(-6px)}}
.menu h1{margin:2px 0 0;font-size:30px;letter-spacing:1px}
.sub{color:var(--muted);margin:4px 0 16px;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;color:#fff;transition:transform .15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.35)}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:26px;display:block}
.tile b{display:block;margin-top:6px;font-size:16px}
.tile small{display:block;color:rgba(255,255,255,.75);font-size:12px;line-height:1.3;margin-top:2px}
.tile.wide{grid-column:span 2}
.t1{background:linear-gradient(160deg,#1f7a8c,#0e3d52)}
.t2{background:linear-gradient(160deg,#6a4fb8,#2c1f55)}
.t3{background:linear-gradient(160deg,#c77a1a,#5a3210)}
.t4{background:linear-gradient(160deg,#c23b4a,#4a1520)}
.t5{background:linear-gradient(160deg,#2e8b57,#123d26)}
.diff{margin-top:16px}
.diff p{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px}
.chips{display:flex;gap:8px;justify-content:center}
.chip{width:auto;margin:0;padding:9px 14px;font-size:14px;background:rgba(255,255,255,.08);color:var(--text);box-shadow:inset 0 0 0 1px rgba(160,220,255,.3)}
.chip.on{background:var(--accent);color:#04201a;box-shadow:none}

/* ===== Écran d'ouverture ===== */
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0f3450 0%,#03080e 75%);transition:opacity .8s ease,visibility .8s;cursor:pointer}
#splash.gone{opacity:0;visibility:hidden}
#splash .rings i{position:absolute;left:50%;top:45%;width:40px;height:40px;margin:-20px 0 0 -20px;border:2px solid rgba(62,224,192,.7);border-radius:50%;animation:ping 2.6s ease-out infinite;opacity:0}
#splash .rings i:nth-child(2){animation-delay:.9s}
#splash .rings i:nth-child(3){animation-delay:1.8s}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(14);opacity:0}}
#splash .sp-logo{position:relative;font-size:60px;filter:drop-shadow(0 0 18px rgba(62,224,192,.7));animation:drop 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{0%{transform:translateY(-70px) rotate(-14deg);opacity:0}60%{transform:translateY(6px) rotate(3deg);opacity:1}100%{transform:none}}
#splash .sp-t{position:relative;margin-top:22px;font-weight:200;font-size:15px;letter-spacing:.42em;text-indent:.42em;color:#eafff9;display:flex;flex-wrap:nowrap}
#splash .sp-t span{display:inline-block;opacity:0;animation:letter .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letter{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#splash .sp-line{position:relative;margin-top:26px;width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(62,224,192,.9),transparent);animation:line 1.6s .9s ease-out forwards}
@keyframes line{to{width:200px}}
#splash .sp-sub{position:relative;margin-top:14px;font-size:10px;letter-spacing:.3em;color:rgba(234,255,249,.45);opacity:0;animation:fade .8s 1.6s forwards}
@keyframes fade{to{opacity:1}}
#splash .sea-wave{position:absolute;left:-10%;right:-10%;bottom:-6px;height:90px;opacity:.35;background:repeating-linear-gradient(90deg,rgba(62,224,192,.5) 0 30px,transparent 30px 60px);-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000);animation:waves 3s linear infinite}
@keyframes waves{to{transform:translateX(60px)}}
.hub{width:min(92vw,380px);text-align:center;color:#fff}
.hub-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.coins{background:rgba(255,200,80,.15);color:#ffd766;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,215,102,.35)}
.wl{font-size:12px;color:var(--muted)}
.hlogo{font-size:44px;display:inline-block;animation:hbob 3s ease-in-out infinite}
@keyframes hbob{50%{transform:translateY(-6px)}}
.hub h1{margin:2px 0 0;font-size:28px;letter-spacing:1px}
.hsub{color:var(--muted);margin:4px 0 16px;font-size:14px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc{border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.35);transition:transform .15s;animation:hrise .5s both}
.hc:active{transform:scale(.96)}
.hc.wide{grid-column:span 2}
.hc:nth-child(2){animation-delay:.05s}.hc:nth-child(3){animation-delay:.1s}.hc:nth-child(4){animation-delay:.15s}.hc:nth-child(5){animation-delay:.2s}
@keyframes hrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hi{font-size:26px;display:block}
.hc b{display:block;margin-top:6px;font-size:16px}
.hc small{display:block;color:rgba(255,255,255,.78);font-size:12px;margin-top:2px}
.c1{background:linear-gradient(160deg,#1f7a8c,#0e3d52)}
.c2{background:linear-gradient(160deg,#6a4fb8,#2c1f55)}
.c3{background:linear-gradient(160deg,#c77a1a,#5a3210)}
.c4{background:linear-gradient(160deg,#c23b4a,#4a1520)}
.c5{background:linear-gradient(160deg,#2e8b57,#123d26)}
.hdiff{margin-top:16px}
.hdiff p{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px}
.hchips{display:flex;gap:8px;justify-content:center}
.hchip{flex:1;width:auto;margin:0;padding:10px 6px;font-size:14px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(160,220,255,.3)}
.hchip.on{background:var(--accent);color:#04201a;box-shadow:none}
.hfoot{display:flex;gap:10px;margin-top:16px}
.hbtn{flex:1;width:auto;margin:0;padding:12px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;box-shadow:inset 0 0 0 1px rgba(160,220,255,.25)}
.panel{width:min(92vw,380px);color:#fff}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ptop b{font-size:18px}
.ptop .hbtn{flex:none;padding:8px 14px}
.ph{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:16px 0 6px}
.srow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:8px}
.sn{flex:1;font-size:15px}
.sw{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.sm{width:auto;margin:0;padding:8px 12px;font-size:13px;background:rgba(255,255,255,.12);color:#fff}
.sm.buy{background:#ffd766;color:#3a2a00}
.sm.on{background:var(--accent);color:#04201a}
.sm.danger{background:#c23b4a}
.pill{font-size:12px;color:var(--accent);padding:6px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--accent)}
.gain{color:#ffd766;font-weight:700;font-size:16px}
body[data-sea="sea_tropical"] #zb .grid,body[data-sea="sea_tropical"] #zt .grid{background:linear-gradient(120deg,#0e7c86,#0a5f6b,#19a7a0,#0a5f6b);background-size:300% 300%;animation:sea 8s ease-in-out infinite}
body[data-sea="sea_arctic"] #zb .grid,body[data-sea="sea_arctic"] #zt .grid{background:linear-gradient(120deg,#5f9fc4,#2b6b91,#8fd0e8,#2b6b91);background-size:300% 300%;animation:sea 8s ease-in-out infinite}
body[data-sea="sea_lava"] #zb .grid,body[data-sea="sea_lava"] #zt .grid{background:linear-gradient(120deg,#5a1408,#a33a10,#ff6a1f,#3a0c05);background-size:300% 300%;animation:sea 8s ease-in-out infinite}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
#ov:has(.menu){background:radial-gradient(circle at 50% 40%,#0d2c40 0%,#050b12 72%);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden}
#ov:has(.menu)::before{content:"";position:absolute;width:160vmax;height:160vmax;left:50%;top:40%;transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,rgba(62,224,192,0) 300deg,rgba(62,224,192,.22) 360deg),repeating-radial-gradient(circle,transparent 0 79px,rgba(62,224,192,.07) 80px 81px);
  animation:sweep 7s linear infinite;pointer-events:none}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
.menu{width:min(88vw,340px);position:relative}
.logo{display:none}
.menu h1{font-weight:200;font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:#eafff9;margin:0;text-indent:.42em;animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 26px rgba(62,224,192,.85)}}
.sub{color:rgba(234,255,249,.45);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:12px 0 34px}
.modes{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.08)}
.tile{display:flex;align-items:center;gap:0;padding:17px 4px;background:none;box-shadow:none;border-radius:0;border-bottom:1px solid rgba(255,255,255,.08);color:#eafff9;animation:rise .6s both}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}.tile:nth-child(5){animation-delay:.24s}
.tile:active{background:rgba(255,255,255,.04);padding-left:12px}
.tile::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:14px;flex:none;box-shadow:0 0 10px var(--c)}
.tile .ic{display:none}
.tile b{font-weight:300;font-size:14px;letter-spacing:.2em;text-transform:uppercase;margin:0;text-align:left}
.tile small{margin-left:auto;font-size:11px;color:rgba(234,255,249,.4);letter-spacing:.02em;text-align:right;padding-left:10px}
.tile::after{content:"→";color:rgba(234,255,249,.35);margin-left:12px;font-size:14px}
.t1{--c:#3ee0c0}.t2{--c:#9b8cff}.t3{--c:#ffb347}.t4{--c:#ff5a6e}.t5{--c:#6fe39b}
.diff{margin-top:34px}
.diff p{color:rgba(234,255,249,.4);font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin:0 0 12px}
.chips{display:flex;background:rgba(255,255,255,.05);border-radius:999px;padding:4px;gap:0}
.chips .chip{flex:1;background:transparent;box-shadow:none;border-radius:999px;padding:9px 6px;margin:0;font-size:12px;letter-spacing:.06em;color:rgba(234,255,249,.5)}
.chips .chip.on{background:rgba(255,255,255,.14);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:rotateX(58deg) translateY(-8px) translateX(0)}25%{transform:rotateX(58deg) translateY(-8px) translateX(-4px)}50%{transform:rotateX(58deg) translateY(-8px) translateX(4px)}75%{transform:rotateX(58deg) translateY(-8px) translateX(-2px)}}
.c.fx::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--hit);animation:ring .8s ease-out forwards;pointer-events:none}
.c.fx.miss::before{border-color:var(--miss)}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
#zb .grid,#zt .grid{background:linear-gradient(120deg,#1d4f72,#0f3550,#22607f,#0f3550);background-size:300% 300%;animation:sea 8s ease-in-out infinite}

<script>
const N = 10, SHIPS = [5, 4, 3, 3, 2], LET = "ABCDEFGHIJ";
const DIFF_LABEL = { easy: 'facile', medium: 'moyen', hard: 'difficile' };
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const SHIP_NAMES = { 5: 'Porte-avions', 4: 'Cuirassé', 3: 'Croiseur', 2: 'Torpilleur' };

/* ---------- Effets sonores (synthétisés, sans fichier) ---------- */
let AC = null;
function sfx(type) {
  if (type === 'sunk') flash();
  if (SAVE.settings.vibe !== false && navigator.vibrate && (type === 'hit' || type === 'sunk' || type === 'lose')) { try { navigator.vibrate(type === 'hit' ? 30 : type === 'sunk' ? [60, 40, 120] : [200]); } catch (e) {} }
  if (!SAVE.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (wave, f0, f1, dur, vol, start = 0) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = wave; o.connect(g); g.connect(AC.destination);
      o.frequency.setValueAtTime(f0, t + start);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + start + dur);
      g.gain.setValueAtTime(vol, t + start);
      g.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
      o.start(t + start); o.stop(t + start + dur + 0.05);
    };
    if (type === 'aim') tone('sine', 1400, 0, 0.08, 0.08);
    else if (type === 'hit') { tone('sawtooth', 180, 40, 0.6, 0.4); tone('square', 90, 30, 0.4, 0.2); }
    else if (type === 'miss') tone('sine', 900, 200, 0.4, 0.2);
    else if (type === 'sunk') { tone('square', 120, 30, 1, 0.35); tone('sawtooth', 60, 20, 1.2, 0.25, 0.15); }
    else {
      const f = type === 'win' ? [523, 659, 784, 1047] : [392, 349, 311, 262];
      f.forEach((hz, k) => tone('triangle', hz, 0, 0.35, 0.25, k * 0.18));
    }
  } catch (e) {}
}
/* Ambiance : bruit de mer (bruit brun filtré, volume qui ondule) */
let AMB = null;
function ambientSync() {
  try {
    const on = SAVE.settings.sound && SAVE.settings.ambient !== false;
    if (!on) { if (AMB && AC) AMB.g.gain.setTargetAtTime(0, AC.currentTime, 0.3); return; }
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!AMB) {
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
      const g = AC.createGain(); g.gain.value = 0;
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = 0.12; lg.gain.value = 0.03; lfo.connect(lg); lg.connect(g.gain);
      src.connect(lp); lp.connect(g); g.connect(AC.destination);
      src.start(); lfo.start();
      AMB = { g };
    }
    AMB.g.gain.setTargetAtTime(0.07, AC.currentTime, 0.6);
  } catch (e) {}
}
document.addEventListener('pointerdown', () => ambientSync(), { once: true });
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  try { if (document.hidden) AC.suspend(); else if (SAVE.settings.sound) AC.resume(); } catch (e) {}
});
function toast(msg, ms = 1900) {
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function flash() { const f = $('flash'); if (!f) return; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function shakeBoard() {
  const z = $('zb'); z.classList.remove('shake'); void z.offsetWidth; z.classList.add('shake');
}

const S = {
  mode: null,          // 'bot' | 'friend'
  phase: 'menu',       // menu | friend | connecting | placing | waiting | playing
  myTurn: false, host: false, ready: false, oppReady: false,
  mine: null, enemy: null,       // enemy = fleet du bot (mode bot only)
  view: Array(100).fill(null),   // état de ma vue sur la flotte adverse
  sunkE: new Set(), fleetE: new Set(),
  eSunk: 0, over: null, room: null, code: '', err: '',
  lastFx: null, target: [], helloTimer: null, canFire: false, diff: 'medium',
  aim: -1, shots: 0, hits: 0, toast: '', toastTimer: null,
  variant: 'classic', timer: null, left: 12, shotsLeft: 5
};

/* ---------- Plateau et logique ---------- */
function newBoard() { return { c: Array.from({ length: 100 }, () => ({ s: -1, shot: false })), ships: [] }; }

function neighbors(i) {
  const r = Math.floor(i / N), c = i % N, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc;
    if ((dr || dc) && rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
  }
  return out;
}
function orth(i) {
  const r = Math.floor(i / N), c = i % N, o = [];
  if (r > 0) o.push(i - N); if (r < N - 1) o.push(i + N);
  if (c > 0) o.push(i - 1); if (c < N - 1) o.push(i + 1);
  return o;
}
function place(b) {
  b.c.forEach(x => { x.s = -1; x.shot = false; });
  b.ships = [];
  SHIPS.forEach((len, k) => {
    for (let t = 0; t < 3000; t++) {
      const h = Math.random() < .5;
      const r = rnd(h ? N : N - len + 1), c = rnd(h ? N - len + 1 : N);
      const cells = [...Array(len)].map((_, j) => h ? r * N + c + j : (r + j) * N + c);
      if (cells.every(i => b.c[i].s < 0 && neighbors(i).every(j => b.c[j].s < 0))) {
        cells.forEach(i => b.c[i].s = k);
        b.ships.push({ len, cells, sunk: false });
        return;
      }
    }
  });
}
function shoot(b, i) {
  const x = b.c[i];
  if (x.shot) return null;
  x.shot = true;
  if (x.s < 0) return { hit: false, sunk: null, over: false };
  const sh = b.ships[x.s];
  const sunk = sh.cells.every(j => b.c[j].shot);
  if (sunk) sh.sunk = true;
  return { hit: true, sunk: sunk ? sh.cells : null, over: b.ships.every(s => s.sunk) };
}
const cellsOf = b => b.ships.flatMap(s => s.cells);

/* ---------- Construction de l'écran ---------- */
function boardHTML(gid) {
  const L = [...LET].map(x => `<span>${x}</span>`).join('');
  const Nn = [...Array(N)].map((_, i) => `<span>${i + 1}</span>`).join('');
  const cells = [...Array(100)].map((_, i) => `<div class="c" data-i="${i}"></div>`).join('');

/* ---------- Peinture ---------- */
function paintEnemy() {
  const g = $('eg');
  [...g.children].forEach((el, i) => {
    let cl = 'c';
    const v = S.view[i];
    if (v === 'hit') cl += ' hit';
    else if (v === 'miss') cl += ' miss';
    else if (S.canFire) cl += ' can';
    if (S.sunkE.has(i)) cl += ' sunk';
    if (S.fleetE.has(i)) cl += ' rev';
    if (S.aim === i) cl += ' aim';
    if (S.power && S.aim >= 0 && areaOf(S.aim, S.power).includes(i)) cl += ' area' + (S.power === 'radar' ? ' scan' : '');
    if (!v && S.scan && S.scan[i] !== null && S.scan[i] !== undefined) cl += S.scan[i] ? ' scanhit' : ' scanmiss';
    if (S.lastFx && S.lastFx.b === 'e' && S.lastFx.i === i) cl += ' fx' + (v === 'miss' ? ' miss' : '');
    el.className = cl;
  });
}
function paintMine() {
  if (!S.mine) return;
  const b = S.mine, g = $('mg');
  [...g.children].forEach((el, i) => {
    const x = b.c[i];
    let cl = 'c';
    if (x.s >= 0) cl += ' ship' + (b.ships[x.s].sunk ? ' dead' : '');
    if (x.shot) cl += x.s >= 0 ? ' hit' : ' miss';
    if (S.lastFx && S.lastFx.b === 'm' && S.lastFx.i === i) cl += ' fx' + (x.s >= 0 ? '' : ' miss');
    el.className = cl;
  });
}

/* ---------- Bateaux 3D (CSS 3D) ---------- */
function boatHTML(x) {
  const cells = x.cells, len = cells.length;
  const rs = cells.map(i => Math.floor(i / N)), cs = cells.map(i => i % N);
  const r0 = Math.min(...rs), c0 = Math.min(...cs);
  const horiz = new Set(rs).size === 1;
  const pos = horiz
    ? `grid-row:${r0 + 1};grid-column:${c0 + 1} / span ${len}`
    : `grid-column:${c0 + 1};grid-row:${r0 + 1} / span ${len}`;
  const layers = '<i class="ly"></i>'.repeat(6);
  const cab = len >= 3 ? '<i class="cab"></i>' : '';
  const dw = horiz ? 60 / len : 60;
  const dmg = (x.hits || []).map(i => {
    const k = cells.indexOf(i), p = (k + 0.5) / len * 100;
    const where = horiz ? `left:${p}%;top:50%` : `left:50%;top:${p}%`;
    return `<i class="dmg" style="${where};width:${dw}%"></i>`;
  }).join('');
  const cls = 'boat ' + (horiz ? 'h' : 'v') + (x.dead ? ' dead' : '') + (x.ghost ? ' ghost' : '');
  return `<div class="${cls}" style="${pos}"><i class="wake"></i><div class="hull">${layers}<i class="ly deck"></i>${cab}</div>${dmg}</div>`;
}
function paintBoatLayer(id, list) {
  const el = $(id);
  if (!el) return;
  const key = JSON.stringify(list.map(x => [x.cells.join('.'), !!x.dead, !!x.ghost, (x.hits || []).join(',')]));
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = list.map(boatHTML).join('');
}
function fleetChips(sunkArrs) {
  const left = sunkArrs.map(c => c.length);
  return '<span class="fleet">' + SHIPS.map(L => {
    const k = left.indexOf(L);
    const dead = k >= 0;
    if (dead) left.splice(k, 1);
    return '<i class="fc' + (dead ? ' d' : '') + '" style="width:' + (L * 9) + 'px"></i>';
  }).join('') + '</span>';
}
function paintBoats() {
  const mine = S.mine ? S.mine.ships.map(s => ({ cells: s.cells, dead: s.sunk, hits: s.cells.filter(i => S.mine.c[i].shot) })) : [];
  paintBoatLayer('mgB', mine);
  const sunk = S.sunkShips || [];
  let enemy;
  if (S.over && S.fleetShips && S.fleetShips.length) {
    enemy = S.fleetShips.map(c => {
      const isSunk = sunk.some(x => x[0] === c[0]);
      return { cells: c, dead: isSunk, ghost: !isSunk, hits: [] };
    });
  } else {
    enemy = sunk.map(c => ({ cells: c, dead: true, hits: [] }));
  }
  paintBoatLayer('egB', enemy);
}

/* ---------- Rendu global ---------- */
function render() {
  const p = S.phase;
  if (S.over && !S.settled) { S.settled = true; award(S.over); }
  if (!S.over) S.settled = false;

  syncTimer();
  $('labE').innerHTML = (S.mode === 'bot' ? 'Ordinateur · ' + DIFF_LABEL[S.diff] : 'Adversaire') + fleetChips(S.sunkShips || []);
  if ($('labM')) $('labM').innerHTML = 'Ma flotte' + fleetChips(S.mine ? S.mine.ships.filter(s => s.sunk).map(s => s.cells) : []);
  paintEnemy(); paintMine(); paintBoats();

  let ban = '', ctl = '';

      `<button class="tr${S.sel === k ? ' sel' : ''}${S.man[k] ? ' done' : ''}" onclick="selShip(${k})">${'■'.repeat(L)}</button>`).join('') +

      (S.mode === 'bot' || S.role === 'host' ? `<button onclick="startPlay()">▶ Commencer</button>` : `<button onclick="readyFriend()">✔ Prêt</button>`);
  } else if (p === 'waiting') {

function botPick() {

  if (S.diff === 'easy') return free[rnd(free.length)];
  if (S.diff === 'medium') {
    S.target = S.target.filter(i => !b.c[i].shot);
    if (S.target.length) return S.target[rnd(S.target.length)];
    return free[rnd(free.length)];
  }
  // Difficile : on compte, pour chaque case, combien de placements possibles des bateaux restants la couvrent
  const score = new Array(100).fill(0);
  b.ships.filter(s => !s.sunk).forEach(s => {
    const len = s.len;
    for (let r = 0; r < N; r++) for (let c = 0; c + len <= N; c++)
      addPlacement(b, score, Array.from({ length: len }, (_, j) => r * N + c + j));
    for (let c = 0; c < N; c++) for (let r = 0; r + len <= N; r++)
      addPlacement(b, score, Array.from({ length: len }, (_, j) => (r + j) * N + c));
  });
  let best = -1, pick = free[0];
  free.forEach(i => { const v = score[i] + Math.random() * 0.5; if (v > best) { best = v; pick = i; } });
  return pick;
}

  if (cells.some(i => b.c[i].shot && (b.c[i].s < 0 || b.ships[b.c[i].s].sunk))) return;
  const hits = cells.filter(i => b.c[i].shot && b.c[i].s >= 0).length;

function areaOf(i, p) {

function b64enc(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function readCode(txt) {

  try { return JSON.parse(b64dec(t.slice(4))); } catch (e) { return null; }
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const okCell = v => Number.isInteger(v) && v >= 0 && v < 100;
const okShip = a => Array.isArray(a) && a.length >= 2 && a.length <= 5 && a.every(okCell);
function cleanResult(r) {
  if (!r || typeof r !== 'object' || !okCell(r.i) || !Array.isArray(r.list) || r.list.length > 25) return null;
  if (r.p && !POWS.includes(r.p)) return null;
  const list = r.list.map(e => (e && okCell(e.i) ? { i: e.i, h: !!e.h, k: e.k && okShip(e.k) ? e.k : null } : null));
  if (list.some(x => !x)) return null;
  if (r.f && !(Array.isArray(r.f) && r.f.length <= 5 && r.f.every(okShip))) return null;
  return { i: r.i, p: r.p || null, list, o: !!r.o, f: r.f || null };
}

function sendCodeHTML() {
  const hint = S.over ? 'Envoie ce code à ton ami : il y verra le résultat.'
    : 'Envoie ce code à ton ami (SMS, WhatsApp…). Il le colle dans son jeu.';
  const can = !!navigator.share;
  return `<div class="card"><h2>Ton tir</h2><p>${hint}</p>
    <textarea id="ocode" readonly onclick="this.select()">${esc(S.outCode)}</textarea>
    <button onclick="${can ? 'shareOut()' : 'copyOut()'}">${can ? 'Envoyer à mon ami' : 'Copier le code'}</button>
    ${can ? '<button class="ghost" onclick="copyOut()">Copier le code</button>' : ''}
    <button class="ghost" onclick="sentOut()">J’ai envoyé</button>
    <button class="ghost" onclick="hideX()">👁 Voir le plateau</button></div>`;
}
function waitCodeHTML() {
  return `<div class="card"><h2>Réponse de ton ami</h2><p>Colle ici le code qu’il t’a envoyé.</p>
    <textarea id="icode" placeholder="BN1.…" autocomplete="off" oninput="S.xin=this.value">${esc(S.xin || '')}</textarea>
    ${S.xerr ? `<p class="err">${S.xerr}</p>` : ''}
    <button onclick="applyCode(document.getElementById('icode').value)">Valider</button>
    <button class="ghost" onclick="pasteIn()">Coller depuis le presse-papiers</button>
    <button class="ghost" onclick="hideX()">👁 Voir le plateau</button></div>`;
}

/* ---------- Partie ami sauvegardée (on peut fermer la page et revenir) ---------- */
const FKEY = 'bataille_friend_v1';
function friendSave() { try { return JSON.parse(localStorage.getItem(FKEY)); } catch (e) { return null; } }
function saveFriend() {
  try {
    if (S.mode !== 'friend' || (S.phase !== 'waiting' && S.phase !== 'playing')) return;
    if (S.over && S.xstate === 'idle') { localStorage.removeItem(FKEY); return; }
    localStorage.setItem(FKEY, JSON.stringify({
      role: S.role, gid: S.gid, seq: S.seq, phase: S.phase, myTurn: S.myTurn, ready: S.ready,
      xstate: S.xstate, outCode: S.outCode, pendShot: S.pendShot, resToSend: S.resToSend,
      over: S.over, view: S.view, sunkShips: S.sunkShips, fleetShips: S.fleetShips,
      shots: S.shots, hits: S.hits, streak: S.streak, mine: S.mine
    }));
  } catch (e) {}
}
function resumeFriend() {
  const d = friendSave();
  if (!d || !d.mine || !Array.isArray(d.mine.c)) { dropFriendSave(); return; }
  resetFriend();
  S.mode = 'friend'; S.variant = 'classic';
  S.role = d.role; S.gid = d.gid; S.code = d.gid || ''; S.seq = d.seq || 0; S.phase = d.phase;
  S.myTurn = !!d.myTurn; S.ready = !!d.ready; S.outCode = d.outCode || '';
  S.pendShot = Number.isInteger(d.pendShot) ? d.pendShot : -1; S.resToSend = d.resToSend || null;
  S.over = d.over || null; S.view = Array.isArray(d.view) ? d.view : Array(100).fill(null);
  S.sunkShips = d.sunkShips || []; S.fleetShips = d.fleetShips || [];
  S.shots = d.shots || 0; S.hits = d.hits || 0; S.streak = d.streak || 0; S.mine = d.mine;
  S.sunkE = new Set(S.sunkShips.flat()); S.fleetE = new Set(S.fleetShips.flat());
  S.settled = !!S.over;
  setX(d.xstate || 'idle');
  render();
}
function dropFriendSave() { try { localStorage.removeItem(FKEY); } catch (e) {} render(); }

/* ---------- Tir du joueur ---------- */
function playerFire(i) {
  if (S.phase !== 'playing' || S.over || !S.myTurn) return;
  if (!S.power && S.view[i]) return;
  if (S.aim !== i) { S.aim = i; sfx('aim'); render(); return; }
  S.aim = -1;
  if (S.mode === 'bot') {
    const p = S.power;
    if (p === 'radar') {
      if (!S.scan) S.scan = Array(100).fill(null);
      areaOf(i, p).forEach(c => { S.scan[c] = S.enemy.c[c].s >= 0 ? 1 : 0; });
      S.powLeft.radar--; S.power = null; S.myTurn = false;
      S.botT = setTimeout(botTurn, 900); render(); return;
    }
    const cells = p ? areaOf(i, p) : [i];
    let anyHit = false, over = false;
    cells.forEach(c => {
      if (S.view[c]) return;
      const r = shoot(S.enemy, c);
      if (!r) return;
      S.view[c] = r.hit ? 'hit' : 'miss';
      S.lastFx = { b: 'e', i: c };
      S.shots++; if (r.hit) { S.hits++; anyHit = true; }
      S.streak = r.hit ? (S.streak || 0) + 1 : 0;
      if (r.sunk) { S.sunkShips = (S.sunkShips || []).concat([r.sunk]); r.sunk.forEach(j => S.sunkE.add(j)); S.eSunk++; sfx('sunk'); toast('🎯 Tu as coulé ' + (SHIP_NAMES[r.sunk.length] ? 'un ' + SHIP_NAMES[r.sunk.length] : 'un bateau') + ' !'); }
      if (r.over) over = true;
    });
    if (p) { S.powLeft[p]--; S.power = null; }
    sfx(anyHit ? 'hit' : 'miss');
    if (S.streak >= 3 && S.streak % 3 === 0) toast('🔥 Série de ' + S.streak + ' touches !');
    if (over) { S.over = 'win'; sfx('win'); S.fleetE = new Set(cellsOf(S.enemy)); S.fleetShips = S.enemy.ships.map(s => s.cells); }
    else if (S.variant === 'practice') { /* entraînement : pas de riposte */ }
    else if (S.variant === 'salvo' && --S.shotsLeft > 0) { /* il reste des tirs dans la salve */ }
    else { S.myTurn = false; S.botT = setTimeout(botTurn, 900); }
    render();
  } else {
    sendShot(i);
  }
}

init();
setTimeout(() => { const sp = document.getElementById('splash'); if (sp) sp.classList.add('gone'); }, 3200);
document.getElementById('splash').addEventListener('click', () => document.getElementById('splash').classList.add('gone'));
</script>
<script>
(function () {
  if (!window.THREE) { document.documentElement.classList.add('nogl'); return; }
  try {
  const app = document.querySelector('.app');
  const canvas = document.createElement('canvas');
  canvas.id = 'sea3d';
  app.prepend(canvas);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const SUN = new THREE.Vector3(0.32, 0.42, -0.85).normalize();

  /* ---- Ciel : dégradé, soleil, halo ---- */
  const skyScene = new THREE.Scene();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { sunDir: { value: SUN } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 sunDir; varying vec3 vDir;',
      'void main(){',
      '  vec3 d = normalize(vDir);',
      '  float h = clamp(d.y, 0.0, 1.0);',
      '  vec3 top = vec3(0.10, 0.36, 0.78);',
      '  vec3 hor = vec3(0.78, 0.92, 0.98);',
      '  vec3 col = mix(hor, top, pow(h, 0.5));',
      '  float s = max(dot(d, normalize(sunDir)), 0.0);',
      '  col += vec3(1.0, 0.86, 0.6) * pow(s, 900.0) * 6.0;',
      '  col += vec3(1.0, 0.82, 0.55) * pow(s, 14.0) * 0.45;',
      '  col += vec3(1.0, 0.9, 0.7) * pow(s, 120.0) * 0.6;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 48, 24), skyMat));

  const pmrem = new THREE.PMREMGenerator(renderer);
  const envTex = pmrem.fromScene(skyScene, 0.02).texture;

  /* ---- Scène principale ---- */
  const scene = new THREE.Scene();
  scene.background = null;
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 48, 24), skyMat));
  scene.environment = envTex;
  scene.fog = new THREE.Fog(0x4f9fc4, 30, 170);
  const cam = new THREE.PerspectiveCamera(48, 1, 0.1, 400);

  const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
  sun.position.copy(SUN).multiplyScalar(100);
  scene.add(sun);

  /* ---- Mer ---- */
  const SEG = 120, SIZE = 400;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const count = pos.count;
  const base = new Float32Array(pos.array);
  const colors = new Float32Array(count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: 0.26, metalness: 0.0,
    clearcoat: 0.3, clearcoatRoughness: 0.22, envMapIntensity: 0.5
  });
  const water = new THREE.Mesh(geo, mat);
  scene.add(water);

  function waveH(x, z, t) {
    let h = 0;
    h += 0.55 * Math.sin(x * 0.32 + z * 0.12 + t * 1.0);
    h += 0.32 * Math.sin(x * 0.58 - z * 0.46 + t * 1.35);
    h += 0.16 * Math.sin(x * 1.15 + z * 1.05 + t * 2.0);
    h += 0.07 * Math.sin(x * 2.4 - z * 1.8 + t * 3.1);
    return h;
  }

  const PALETTES = {
    default: [0x06385a, 0x1d7fa8],
    sea_tropical: [0x0a6a72, 0x3ee0cf],
    sea_arctic: [0x2e6a92, 0xbfe9f7],
    sea_lava: [0x3a0c05, 0xff7a2a],
    sea_sunset: [0x3d1c3f, 0xff7a4a]
  };
  const FOAM = new THREE.Color(0xf4fdff);
  let palKey = '', deep = new THREE.Color(), mid = new THREE.Color();
  const tmp = new THREE.Color();

  /* ---- Textures : embruns et nuages ---- */
  function blobTexture(size, blobs) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    for (let k = 0; k < blobs; k++) {
      const x = size * (0.3 + Math.random() * 0.4), y = size * (0.35 + Math.random() * 0.3);
      const r = size * (0.12 + Math.random() * 0.18);
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, 'rgba(255,255,255,0.9)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  const sprayTex = blobTexture(64, 1);
  const cloudTex = blobTexture(256, 14);
  const glowTex = blobTexture(128, 1);

  /* ---- Nuages ---- */
  const clouds = [];
  for (let k = 0; k < 9; k++) {
    const m = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.55 + Math.random() * 0.3, depthWrite: false, fog: false });
    const s = new THREE.Sprite(m);
    const sc = 30 + Math.random() * 30;
    s.scale.set(sc, sc * 0.45, 1);
    s.position.set(-120 + Math.random() * 240, 26 + Math.random() * 16, -90 - Math.random() * 60);
    s.userData.speed = 0.4 + Math.random() * 0.8;
    scene.add(s); clouds.push(s);
  }

  /* ---- Soleil (halo) ---- */
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xfff0c8, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  sunSprite.position.copy(SUN).multiplyScalar(180);
  sunSprite.scale.set(70, 70, 1);
  scene.add(sunSprite);

  /* ---- Embruns ---- */
  const NP = 220;
  const pPos = new Float32Array(NP * 3), pVel = new Float32Array(NP * 3);
  const spray = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pPos, 3)),
    new THREE.PointsMaterial({ map: sprayTex, size: 0.45, transparent: true, opacity: 0.85, depthWrite: false, color: 0xffffff, sizeAttenuation: true })
  );
  scene.add(spray);
  function respawn(i, t) {
    const x = (Math.random() - 0.5) * 26, z = -2 + Math.random() * 12;
    pPos[i * 3] = x; pPos[i * 3 + 1] = waveH(x, z, t) * 1.8 + 0.1; pPos[i * 3 + 2] = z;
    pVel[i * 3] = (Math.random() - 0.5) * 1.2;
    pVel[i * 3 + 1] = 1.6 + Math.random() * 2.6;
    pVel[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
  }
  for (let i = 0; i < NP; i++) respawn(i, 0);

  /* ---- Taille ---- */
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const boards = [document.querySelector('#zt .bw'), document.querySelector('#zb .bw')].filter(Boolean);
  const t0 = performance.now();
  let last = t0, fr = 1, acc = 0, nf = 0;
  let ECO = typeof SAVE !== 'undefined' && !!(SAVE.settings && SAVE.settings.eco);
  function setEco(v) {
    ECO = !!v;
    renderer.setPixelRatio(ECO ? 1 : Math.min(window.devicePixelRatio || 1, 1.75));
    resize();
  }
  window.seaEco = setEco;
  if (ECO) setEco(true);

  function frame(now) {
    const t = (now - t0) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    fr++;
    if (document.body.classList.contains('noanim') && fr > 3) { requestAnimationFrame(frame); return; }
    acc += dt; if (++nf === 90 && !ECO && acc / 90 > 0.03) setEco(true);

    const key = document.body.dataset.sea || 'default';
    if (key !== palKey) {
      palKey = key;
      const p = PALETTES[key] || PALETTES.default;
      deep = new THREE.Color(p[0]); mid = new THREE.Color(p[1]);
    }

    /* Surface de l'eau (mise à jour une image sur 2, ou sur 4 en mode économie) */
    if (fr % (ECO ? 4 : 2) === 0) {
    for (let i = 0; i < count; i++) {
      const x = base[i * 3], z = base[i * 3 + 2];
      const h = waveH(x, z, t);
      pos.array[i * 3 + 1] = h * 1.8;
      const k = Math.min(1, Math.max(0, (h + 0.5) * 0.9));
      tmp.copy(deep).lerp(mid, k);
      const foam = Math.min(1, Math.max(0, (h - 0.6) * 3.5));
      tmp.lerp(FOAM, foam);
      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    pos.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    geo.computeVertexNormals();
    }

    /* Embruns */
    for (let i = 0; i < NP; i++) {
      pVel[i * 3 + 1] -= 9.8 * dt;
      pPos[i * 3] += pVel[i * 3] * dt;
      pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
      pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
      if (pPos[i * 3 + 1] < waveH(pPos[i * 3], pPos[i * 3 + 2], t) * 1.8 - 0.05) respawn(i, t);
    }
    spray.geometry.attributes.position.needsUpdate = true;

    /* Nuages */
    for (let k = 0; k < clouds.length; k++) {
      const c = clouds[k];
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 130) c.position.x = -130;
    }

    /* Caméra : vue basse, de côté, avec un léger roulis */
    cam.position.set(Math.sin(t * 0.13) * 1.6, 6.2 + Math.sin(t * 0.5) * 0.15, 15);
    cam.lookAt(0, -0.8, -4);
    renderer.render(scene, cam);

    /* Les plateaux suivent les vagues */
    for (let b = 0; b < boards.length; b++) {
      const s = Math.sin(t * 1.1 + b * 1.7);
      const r = Math.cos(t * 0.8 + b * 1.1);
      boards[b].style.transform = 'rotateX(58deg) translateY(' + (-8 + s * 5) + 'px) translateZ(' + (s * 6) + 'px) rotateZ(' + (r * 2.2) + 'deg)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  } catch (e) {
    var cv = document.getElementById('sea3d'); if (cv) cv.remove();
    document.documentElement.classList.add('nogl');
  }
})();
</script>
